services:
  - type: web
    name: duolingo-clone-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: duolingo-clone-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ENABLE_DEMO_TOOLS
        value: "true"

databases:
  - name: duolingo-clone-db
    plan: free
    region: singapore
    databaseName: duolingo_clone
    user: duolingo_clone
