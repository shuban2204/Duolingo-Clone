services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/duolingo.db
      FRONTEND_ORIGINS: http://localhost:3000
    volumes: ["duolingo-data:/data"]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
volumes:
  duolingo-data:

